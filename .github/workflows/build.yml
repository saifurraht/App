name: Build Android WebView App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Android project
        run: |
          unzip -o "ACS_Frb_26_Android_Project.zip" -d app_src
          echo "✅ Extracted ZIP to app_src/"
          ls -R app_src

      - name: Detect Gradle folder
        id: detect
        run: |
          GRADLEW_PATH=$(find app_src -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew not found!"
            exit 1
          fi
          echo "✅ Found Gradle wrapper at: $GRADLEW_PATH"
          echo "gradle_path=$(dirname $GRADLEW_PATH)" >> $GITHUB_OUTPUT

      - name: Make Gradle wrapper executable
        run: chmod +x "${{ steps.detect.outputs.gradle_path }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.gradle_path }}
        run: ./gradlew assembleDebug

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: ACS_Frb_26_Debug_APK
          path: ${{ steps.detect.outputs.gradle_path }}/app/build/outputs/apk/debug/*.apk
