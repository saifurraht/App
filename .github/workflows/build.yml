name: Build ACS_Frb_26 WebView App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 (for Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Install Gradle (since gradlew is missing)
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Extract ZIP
      - name: Extract Android project
        run: |
          unzip -o "ACS_Frb_26_Android_Project.zip" -d project
          echo "✅ Extracted project files:"
          ls -R project | head -40

      # Step 5: Build debug APK using Gradle
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      # Step 6: Upload APK as artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACS_Frb_26_Debug_APK
          path: project/app/build/outputs/apk/debug/*.apk
