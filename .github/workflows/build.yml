name: Build ACS_Frb_26 WebView App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use Gradle 7.5 (compatible with older Android plugin)
      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5

      - name: Extract Android project
        run: |
          unzip -o "ACS_Frb_26_Android_Project.zip" -d project
          echo "✅ Extracted project files:"
          ls -R project | head -40

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACS_Frb_26_Debug_APK
          path: project/app/build/outputs/apk/debug/*.apk
